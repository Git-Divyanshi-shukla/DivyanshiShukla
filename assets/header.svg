<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Divyanshi Shukla - ML, AI and Full-Stack Developer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="0.55" stop-color="#16193A"/><stop offset="1" stop-color="#0B1020"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF"><animate attributeName="stop-color" values="#00E5FF;#B26BFF;#00E5FF" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#B26BFF"><animate attributeName="stop-color" values="#B26BFF;#00E5FF;#B26BFF" dur="6s" repeatCount="indefinite"/></stop></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
<radialGradient id="g1"><stop offset="0" stop-color="#00E5FF" stop-opacity="0.35"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#B26BFF" stop-opacity="0.35"/><stop offset="1" stop-color="#B26BFF" stop-opacity="0"/></radialGradient>
<clipPath id="type"><rect x="60" y="196" width="0" height="40"><animate attributeName="width" values="0;640;640;0" keyTimes="0;0.45;0.9;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect width="1000" height="300" rx="18" fill="url(#bg)"/>
<rect width="1000" height="300" rx="18" fill="url(#grid)"/>
<circle cx="860" cy="70" r="150" fill="url(#g1)"><animate attributeName="cx" values="860;820;860" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="140" cy="260" r="170" fill="url(#g2)"><animate attributeName="cy" values="260;220;260" dur="11s" repeatCount="indefinite"/></circle>
<!-- neural net motif -->
<g stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1.2">
<line x1="770" y1="70" x2="850" y2="50"/><line x1="770" y1="70" x2="850" y2="120"/><line x1="770" y1="70" x2="850" y2="190"/>
<line x1="770" y1="150" x2="850" y2="50"/><line x1="770" y1="150" x2="850" y2="120"/><line x1="770" y1="150" x2="850" y2="190"/>
<line x1="770" y1="230" x2="850" y2="50"/><line x1="770" y1="230" x2="850" y2="120"/><line x1="770" y1="230" x2="850" y2="190"/>
<line x1="850" y1="50" x2="930" y2="100"/><line x1="850" y1="120" x2="930" y2="100"/><line x1="850" y1="190" x2="930" y2="100"/>
<line x1="850" y1="50" x2="930" y2="190"/><line x1="850" y1="120" x2="930" y2="190"/><line x1="850" y1="190" x2="930" y2="190"/>
</g>
<g fill="#0B1020" stroke="url(#ac)" stroke-width="2">
<circle cx="770" cy="70" r="9"/><circle cx="770" cy="150" r="9"/><circle cx="770" cy="230" r="9"/>
<circle cx="850" cy="50" r="9"/><circle cx="850" cy="120" r="9"/><circle cx="850" cy="190" r="9"/>
<circle cx="930" cy="100" r="9"/><circle cx="930" cy="190" r="9"/>
</g>
<g fill="#00E5FF"><circle cx="770" cy="150" r="3.5"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="850" cy="120" r="3.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="930" cy="190" r="3.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle></g>
<text x="60" y="78" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" fill="#7C86B8">&lt;/&gt; hello, world — I'm</text>
<text x="58" y="150" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="800" fill="url(#ac)">Divyanshi Shukla</text>
<text x="60" y="184" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#C7CCEA" letter-spacing="0.5">CS Undergraduate · ML &amp; AI Engineer · Full-Stack Builder</text>
<g clip-path="url(#type)"><text x="60" y="222" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="19" fill="#00E5FF">$ building AI-powered systems that ship_</text></g>
<rect x="60" y="256" width="120" height="4" rx="2" fill="url(#ac)"/>
<rect x="190" y="256" width="40" height="4" rx="2" fill="#B26BFF" opacity="0.6"/>
</svg>